schemaVersion = 5
appRules = []

[general]
hotkeysEnabled = true
systemHyperTrigger = "None"
hyperKeyModifiers = "Control+Option+Shift+Command"
defaultLayoutType = "niri"
preventSleepEnabled = false
updateChecksEnabled = false
ipcEnabled = true
animationsEnabled = true
animationSpeed = 1.0
workspaceAutoBackAndForth = false

[focus]
followsMouse = true
edgeNavigationInterval = 1.5
raiseOnMouseFocus = false
lockModifier = "off"
moveMouseToFocusedWindow = false
followsWindowToMonitor = true
crossesMonitorAtEdge = true
moveCrossesMonitorAtEdge = false

[mouseWarp]
margin = 1
enabled = false
constrainToArrangement = false

[routing]
mode = "macOS"
arrangements = []

[gaps]
size = 10.0
fullscreenUsesOuterGaps = false
outer = { left = 5.0, right = 5.0, top = 5.0, bottom = 5.0 }

[niri]
visibleContainerCount = 2
infiniteLoop = false
centerFocusedColumn = "never"
alwaysCenterSingleColumn = false
singleWindowFit = "container_primary_span"
containerPrimarySpanPresets = [0.3266666666666667, 0.49, 0.6533333333333333, 0.98]
defaultContainerPrimarySpan = 0.49
edgeGaps = true
resizeStepPercent = 5
moveWindowStacksIntoColumn = true
allowOverscroll = false

[dwindle]
smartSplit = false
defaultSplitRatio = 1.0
splitWidthMultiplier = 1.0
singleWindowFit = "fill"
useGlobalGaps = true
moveToRootStable = true

[borders]
enabled = true
width = 2.0
color = { red = 0.33, green = 0.66, blue = 1.0, alpha = 1.0 }

[overview]
enabled = true
zoom = 1.0
backdrop = { red = 0.05, green = 0.05, blue = 0.08, alpha = 0.0 }
matchFocusBorder = true

[overview.windowBorders]
normal = { red = 0.3, green = 0.3, blue = 0.35, alpha = 0.5 }
hovered = { red = 0.4, green = 0.6, blue = 1.0, alpha = 1.0 }
selected = { red = 0.3, green = 0.8, blue = 0.4, alpha = 1.0 }

[workspaceBar]
enabled = true
showLabels = true
showFloatingWindows = true
windowLevel = "floating"
position = "overlappingMenuBar"
notchMode = "off"
notchActiveZoneWidth = 180.0
fullWidth = true
fullWidthNotchMode = "splitAroundNotch"
systemStatsButton = false
deduplicateAppIcons = false
# OmniWM also skips hidden empty workspaces during keyboard navigation.
hideEmptyWorkspaces = false
excludedBundleIDs = []
iconOverrides = {}
reserveLayoutSpace = true
autoHide = false
revealModifier = "off"
revealHoldMilliseconds = 200.0
hideInNativeFullscreen = true
height = 24.0
backgroundOpacity = 0.9
xOffset = 0.0
yOffset = 0.0

[gestures]
scrollEnabled = true
scrollSensitivity = 5.0
scrollModifierKey = "commandShift"
mouseMoveModifierKey = "command"
mouseResizeModifierKey = "command"
fingerCount = 4
invertDirection = false
trackpadScrollStyle = "snap"
workspaceSwipeEnabled = true
workspaceSwipeFingerCount = 3
workspaceSwipeAxis = "horizontal"
workspaceSwipeEdgeBehavior = "cycle"

[statusBar]
showWorkspaceName = false
showAppNames = false
useWorkspaceId = false

[hiddenBar]
enabled = false
hiddenBundleIDs = []
rehideIntervalSeconds = 5.0

[clipboard]
historyEnabled = false
maxItems = 200
maxItemBytes = 8388608
maxTotalBytes = 67108864

[quakeTerminal]
enabled = false
position = "center"
widthPercent = 50.0
heightPercent = 50.0
animationDuration = 0.2
autoHide = false
backgroundEffect = "standardBlur"

[scratchpads]
labels = { "1" = "scratchpad" }

[appearance]
mode = "dark"
tabRailAppIcons = false

# Start with a small native pool. Monitor roles follow macOS's arrangement;
# specific display IDs must be established with the dock connected.
[[workspaces]]
id = "AD36F001-C57E-41A5-AC1D-DF5249D007F0"
name = "1"
monitorAssignment = { type = "main" }
layoutType = "niri"

[[workspaces]]
id = "454CECD4-5E9D-4ED1-95D7-979D48817F5F"
name = "2"
monitorAssignment = { type = "main" }
layoutType = "niri"

[[workspaces]]
id = "BEB842B5-E894-4791-9FD1-397C3CDD3538"
name = "3"
monitorAssignment = { type = "main" }
layoutType = "niri"

[[workspaces]]
id = "248AA883-2261-4D45-943C-79C0E46A232B"
name = "4"
monitorAssignment = { type = "secondary" }
layoutType = "niri"

[[workspaces]]
id = "8B8C45D6-CE9E-41D9-BD50-BE4989D5E3DE"
name = "5"
monitorAssignment = { type = "secondary" }
layoutType = "niri"

# Karabiner normalizes both physical Super keys to Right Command.
# Synthesized application shortcuts use Left Command and do not match these.
[[hotkeys]]
id = "focus.left"
binding = "Right Command+H"

[[hotkeys]]
id = "focus.down"
binding = "Right Command+J"

[[hotkeys]]
id = "focus.up"
binding = "Right Command+K"

[[hotkeys]]
id = "focus.right"
binding = "Right Command+L"

[[hotkeys]]
id = "moveColumn.left"
binding = "Right Command+Shift+H"

[[hotkeys]]
id = "moveWindowDown"
binding = "Right Command+Shift+J"

[[hotkeys]]
id = "moveWindowUp"
binding = "Right Command+Shift+K"

[[hotkeys]]
id = "moveColumn.right"
binding = "Right Command+Shift+L"

[[hotkeys]]
id = "move.left"
binding = "Right Command+Control+H"

[[hotkeys]]
id = "move.right"
binding = "Right Command+Control+L"

[[hotkeys]]
id = "resizeContainerPrimarySpan.shrink"
binding = "Right Command+Minus"

[[hotkeys]]
id = "resizeContainerPrimarySpan.grow"
binding = "Right Command+Equal"

[[hotkeys]]
id = "cycleSizeForward"
binding = "Right Command+R"

[[hotkeys]]
id = "cycleSizeBackward"
binding = "Right Command+E"

[[hotkeys]]
id = "closeFocusedWindow"
binding = "Right Command+W"

[[hotkeys]]
id = "toggleFullscreen"
binding = "Right Command+F"

[[hotkeys]]
id = "toggleFocusedWindowFloating"
binding = "Right Command+Shift+F"

[[hotkeys]]
id = "toggleScratchpad.1"
binding = "Right Command+S"

[[hotkeys]]
id = "assignFocusedWindowToScratchpad.1"
binding = "Right Command+Option+S"

[[hotkeys]]
id = "openCommandPalette.applications"
binding = "Right Command+Space"

[[hotkeys]]
id = "toggleWorkspaceLayout"
binding = "Right Command+T"

# Keyboard and swipe navigation wrap and include empty workspaces, unlike
# Hyprland's bounded skip-gap policy.
[[hotkeys]]
id = "switchWorkspace.previous"
binding = "Control+Option+H"

[[hotkeys]]
id = "switchWorkspace.next"
binding = "Control+Option+L"

[[hotkeys]]
id = "moveWindowToWorkspaceUp"
binding = "Control+Option+Shift+H"

[[hotkeys]]
id = "moveWindowToWorkspaceDown"
binding = "Control+Option+Shift+L"
