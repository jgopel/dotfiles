config_version = 15

[bar.default]
center = ["notifications", "spacer_5", "clock", "spacer_2", "weather"]
end = ["media", "spacer_7", "tray", "syncthing", "spacer_6", "clipboard", "network", "brightness", "battery"]
start = ["launcher", "workspaces", "spacer_3", "cpu", "spacer_4", "ram"]

[idle.behavior.lock]
timeout = 300
action = "lock"

[idle.behavior.screen-off]
timeout = 330
action = "screen_off"

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@DP-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
box_height = 196.0
box_width = 810.0
cx = 1920.0
cy = 1978.0
output = "DP-1"
placement_height = 2160.0
placement_width = 3840.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_password_reveal = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[nightlight]
enabled = true

[notification]
history_retention_hours = 168
position = "top_center"
width = 500

[plugins]
enabled = ["michael-retunzew/hyprland-settings", "rylos/syncthing"]

[plugin_settings."rylos/syncthing"]
notify_events = false

[shell]
time_format = "{:%I:%M %p}"

[shell.screenshot]
directory = "~/Pictures/Screenshots"

[theme]
builtin = "Tokyo-Night"

[theme.templates]
enable_builtin_templates = false

[wallpaper.default]
path = "~/.config/background"

[widget.clock]
format = "{:%I:%M %p}"

[widget.network]
show_label = false
vpn_status = "both"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
length = 30
type = "spacer"

[widget.spacer_4]
type = "spacer"

[widget.spacer_5]
type = "spacer"

[widget.spacer_6]
type = "spacer"

[widget.spacer_7]
type = "spacer"

[widget.syncthing]
type = "rylos/syncthing:bar"

[widget.volume]
show_label = false

[widget.workspaces]
hide_when_empty = true
show_labels = false
show_all_outputs = true
