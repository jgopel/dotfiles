- name: Setup Development Environment
  hosts: localhost
  connection: local

  vars:
    dotfiles_dir: "{{ playbook_dir }}"
    # TODO
    # backup_enabled: yes
    system_packages:
      - ack
      - atop
      - bash
      - bash-completion
      - cmake
      - cmake-doc
      - containerd.io
      - curl
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
      - dtrx
      - fzf
      - g++
      - gcc
      - git
      - htop
      - jq
      - neovim
      - ninja-build
      - plocate
      - python3
      - python3-dev
      - python3-venv
      - ripgrep
      - syncthing
      - tmux
      - tree
      - wget
      - yq
    gui_packages:
      - fontconfig  # For fc-cache

  tasks:
    - name: Install all prereqs
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
      become: yes

    - name: Add Neovim unstable PPA
      ansible.builtin.apt_repository:
        repo: ppa:neovim-ppa/unstable
      become: yes

    - name: Add Docker repo to apt sources
      block:
        - name: docker | add key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
          become: yes

        - name: docker | apt source
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            state: present
            update_cache: false
          become: yes

    - name: Add Syncthing repo to apt sources
      block:
        - name: syncthing | add key
          ansible.builtin.get_url:
            url: https://syncthing.net/release-key.gpg
            dest: /etc/apt/keyrings/syncthing-archive-keyring.gpg
          become: yes

        - name: syncthing | apt source
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/syncthing-archive-keyring.gpg] https://apt.syncthing.net/ syncthing stable"
            state: present
            update_cache: false
          become: yes

    - name: Install all specified system packages
      ansible.builtin.apt:
        name: "{{ system_packages }}"
        state: latest
        update_cache: true
      become: yes

    - name: Add current user to the docker group
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: yes
      become: yes
      register: docker_group_result

    - name: Ensure Docker service is started and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes
      become: yes

    - name: Create common directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ ansible_env.HOME }}/.config"
        - "{{ ansible_env.HOME }}/.config/nvim"
        - "{{ ansible_env.HOME }}/.config/nvim/lua"
        - "{{ ansible_env.HOME }}/.config/nvim/lua/config"
        - "{{ ansible_env.HOME }}/.fonts"
        - "{{ ansible_env.HOME }}/bin"

    - name: Symlink configuration files
      ansible.builtin.file:
        src: "{{ dotfiles_dir }}/{{ item.src }}"
        dest: "{{ ansible_env.HOME }}/{{ item.dest }}"
        state: link
        force: yes
        # backup: "{{ backup_enabled }}"
      loop:
        - {src: 'bash/.bash_profiles', dest: '.bash_profiles'}
        - {src: 'bash/.bashrc', dest: '.bashrc'}
        - {src: 'bash/.editrc', dest: '.editrc'}
        - {src: 'bash/.inputrc', dest: '.inputrc'}
        - {src: 'bin', dest: 'bin'}
        - {src: 'git/.gitconfig', dest: '.gitconfig'}
        - {src: 'git/.gitignore_global', dest: '.gitignore_global'}
        - {src: 'nvim/init.lua', dest: '.config/nvim/init.lua'}
        - {src: 'nvim/lua/config/lazy.lua', dest: '.config/nvim/lua/config/lazy.lua',}
        - {src: 'tmux/.tmux.conf', dest: '.tmux.conf'}

    - name: Run setup-tmux script
      ansible.builtin.command: "{{ dotfiles_dir }}/bin/setup-tmux"
      args:
        chdir: "{{ ansible_env.HOME }}"
      changed_when: false

    - name: Decide if this is a GUI system
      ansible.builtin.stat:
        path: "/usr/bin/gnome-shell"
      register: is_gui_system

    - name: Install GUI packages
      ansible.builtin.apt:
        name: "{{ gui_packages }}"
        state: latest
        update_cache: true
      become: yes
      when: is_gui_system.stat.exists

    - name: Copy fonts
      ansible.builtin.copy:
        src: "{{ dotfiles_dir }}/fonts/"
        dest: "{{ ansible_env.HOME }}/.fonts/"
        mode: '0644'
      register: fonts_copied
      when: is_gui_system.stat.exists

    - name: Update font cache if fonts were copied
      ansible.builtin.command: fc-cache -f -v
      when: fonts_copied.changed
      changed_when: false
      ignore_errors: yes

    - name: Fetch ghostty installer
      ansible.builtin.uri:
        url: https://raw.githubusercontent.com/mkasberg/ghostty-ubuntu/HEAD/install.sh
        return_content: yes
      register: ghostty_installer

    - name: Run ghostty installer
      ansible.builtin.shell:
        cmd: bash -s -- -y
        stdin: "{{ ghostty_installer.content }}"

    - name: Symlink Ghostty config files
      ansible.builtin.file:
        src: "{{ dotfiles_dir }}/ghostty/config"
        dest: "{{ ansible_env.HOME }}/.config/ghostty/config"
        state: link
        force: yes
        # backup: "{{ backup_enabled }}"
      when: is_gui_system.stat.exists
