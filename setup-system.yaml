---
- name: Setup Development Environment
  hosts: localhost
  connection: local

  vars:
    dotfiles_dir: "{{ playbook_dir }}"
    # TODO
    # backup_enabled: yes 
    system_packages:
      - ack
      - atop
      - bash
      - bash-completion
      - cmake
      - cmake-doc
      - curl
      - dtrx
      - fontconfig  # For fc-cache
      - fzf
      - g++
      - gcc
      - git
      - gnome-tweaks
      - htop
      - jq
      - neovim      
      - ninja-build
      - plocate
      - python3
      - python3-dev
      - python3-venv
      - ripgrep    
      - tmux
      - tree
      - wget
      - yq

  tasks:
    - name: Ensure apt cache is updated
      ansible.builtin.apt:
        update_cache: yes
      changed_when: false
      become: yes

    - name: Add Neovim unstable PPA
      ansible.builtin.apt_repository:
        repo: ppa:neovim-ppa/unstable
        state: present
        update_cache: yes
      become: yes

    - name: Install all specified system packages
      ansible.builtin.apt:
        name: "{{ system_packages }}"
        state: present
      become: yes

    - name: Create common directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ ansible_env.HOME }}/.config"
        - "{{ ansible_env.HOME }}/.config/nvim"
        - "{{ ansible_env.HOME }}/.config/nvim/lua"
        - "{{ ansible_env.HOME }}/.config/nvim/lua/config"
        - "{{ ansible_env.HOME }}/.fonts"
        - "{{ ansible_env.HOME }}/bin"

    - name: Symlink shell configuration files
      ansible.builtin.file:
        src: "{{ dotfiles_dir }}/bash/{{ item }}"
        dest: "{{ ansible_env.HOME }}/{{ item }}"
        state: link
        force: yes
        # backup: "{{ backup_enabled }}"
      loop:
        - .bashrc
        - .bash_profiles
        - .inputrc
        - .editrc

    - name: Symlink local bin directory
      ansible.builtin.file:
        src: "{{ dotfiles_dir }}/bin"
        dest: "{{ ansible_env.HOME }}/bin"
        state: link
        force: yes
        # backup: "{{ backup_enabled }}"

    - name: Symlink ctags configuration
      ansible.builtin.file:
        src: "{{ dotfiles_dir }}/ctags/.ctags"
        dest: "{{ ansible_env.HOME }}/.ctags"
        state: link
        force: yes
        # backup: "{{ backup_enabled }}"

    - name: Copy fonts
      ansible.builtin.copy:
        src: "{{ dotfiles_dir }}/fonts/"
        dest: "{{ ansible_env.HOME }}/.fonts/"
        mode: '0644'
      register: fonts_copied

    - name: Update font cache if fonts were copied
      ansible.builtin.command: fc-cache -f -v
      when: fonts_copied.changed
      changed_when: false
      ignore_errors: yes

    - name: Symlink git configuration files
      ansible.builtin.file:
        src: "{{ dotfiles_dir }}/git/{{ item }}"
        dest: "{{ ansible_env.HOME }}/.{{ item }}"
        state: link
        force: yes
        # backup: "{{ backup_enabled }}"
      loop:
        - gitconfig
        - gitignore_global

    - name: Symlink tmux configuration
      ansible.builtin.file:
        src: "{{ dotfiles_dir }}/tmux/.tmux.conf"
        dest: "{{ ansible_env.HOME }}/.tmux.conf"
        state: link
        force: yes
        # backup: "{{ backup_enabled }}"

    - name: Run setup-tmux script
      ansible.builtin.command: "{{ dotfiles_dir }}/bin/setup-tmux"
      args:
        chdir: "{{ ansible_env.HOME }}"
      changed_when: false

    - name: Symlink Neovim configuration files
      ansible.builtin.file:
        src: "{{ dotfiles_dir }}/nvim/{{ item.src }}"
        dest: "{{ ansible_env.HOME }}/.config/nvim/{{ item.dest }}"
        state: link
        force: yes
        # backup: "{{ backup_enabled }}"
      loop:
        - { src: 'init.lua', dest: 'init.lua' }
        - { src: 'lua/config/lazy.lua', dest: 'lua/config/lazy.lua' }
